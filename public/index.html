<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Login Modal -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-comments"></i> Join Chat</h2>
                    <p>Enter your username to start chatting</p>
                </div>
                <div class="modal-body">
                    <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20">
                    <button id="joinBtn" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Join Chat
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Chat Interface -->
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <h1><i class="fas fa-comments"></i> Web Chat</h1>
                    <span id="onlineCount" class="online-count">0 users online</span>
                </div>
                <div class="header-right">
                    <button id="toggleUsers" class="btn btn-secondary">
                        <i class="fas fa-users"></i> Users
                    </button>
                </div>
            </div>

            <!-- Chat Content -->
            <div class="chat-content">
                <!-- Messages Area -->
                <div class="messages-container">
                    <div id="messages" class="messages"></div>
                    <div id="typingIndicator" class="typing-indicator"></div>
                </div>

                <!-- Users Sidebar -->
                <div id="usersSidebar" class="users-sidebar">
                    <h3><i class="fas fa-users"></i> Online Users</h3>
                    <div id="usersList" class="users-list"></div>
                </div>
            </div>

            <!-- Message Input -->
            <div class="message-input-container">
                <div class="input-group">
                    <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                    <button id="sendBtn" class="btn btn-primary" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <i class="fas fa-circle"></i> <span>Connecting...</span>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
